    const sizeField = isCountShape ? numField : denField;
    const countLabel = isCountShape ? "Findings" : "Trials";
    const rateLabel = isCountShape ? "Share" : "Signal rate";
    const bodyRows = rows.map((r) => {
      const href = drillHrefFn ? "#/trials?" + drillHrefFn(r) : null;
      // keyField doubles as the label-map kind (severity/sponsorClass/concern/...);
      // free-text keys (sponsor, condition, year, histogram bucket) have no map entry
      // and pass through label() untouched.
      const text = keyField === "phase" ? phaseLabel(r[keyField]) : label(keyField, r[keyField]);
      return (
        "<tr" + (href ? ' class="drill-row" data-href="' + href + '" tabindex="0"' : "") + ">" +
          '<td title="' + escapeHtml(String(r[keyField] ?? "")) + '">' + escapeHtml(String(text)) + "</td>" +
          '<td class="mono">' + r[sizeField] + "</td>" +
          rateCellHtml(r[numField], r[denField], r.rate, r.lowN) +
        "</tr>"
      );
    }).join("");
    return (
      '<section class="analytics-table-section">' +
        '<h2 class="analytics-section-title">' + escapeHtml(sectionTitle) + "</h2>" +
        (caption ? '<p class="analytics-caption">' + escapeHtml(caption) + "</p>" : "") +
        '<div class="table-wrap"><table class="ledger analytics-table">' +
          "<thead><tr><th>" + escapeHtml(columnLabel) + "</th><th>" + countLabel + "</th><th>" + rateLabel + "</th></tr></thead>" +
          "<tbody>" + bodyRows + "</tbody>" +
        "</table></div>" +
      "</section>"
    );
  }

  async function renderAnalyticsView() {
    setView("analytics", "<main>" + loadingHtml("the analytics") + "</main>");

    let data;
    try {
      data = await fetchAnalytics();
    } catch (err) {
      setView("analytics", '<main class="view-enter analytics-view">' + errorHtml(err, route) + footerHtml() + "</main>");
      return;
    }
    if (!data) { // DEMO mode: no corpus to aggregate, and no numbers worth inventing
      setView("analytics", '<main class="view-enter analytics-view">' +
        '<p class="status-note">Analytics needs the live API (no server responding at /api/analytics).</p>' +
        footerHtml() + "</main>");
      return;
    }

    // The corpus caveat is the footer's job on every view now, so this one goes there
    // instead of into a second tagline the reader has already read on the index.
    corpusCaveat = data.caveat || corpusCaveat;

    const sponsorNote = data.signalRateBySponsor.length
      ? ""
      : '<p class="analytics-empty-note">No sponsor in this corpus has the ≥5 trials this table requires.</p>';

    // Fix round 1 (task16-review.md Critical-2): disclose, don't just silently drop,
    // the CTIS trials every rate table below already excludes.
    const ctisNote = data.ctisExcludedCount
      ? '<p class="analytics-empty-note">EU CTIS trials (' + data.ctisExcludedCount + ') are monitored ' +
        "prospectively and excluded from these rates until they accumulate version history.</p>"
      : "";

    // Each caption names the denominator its rate is over, so no bar can be read
    // against the wrong total.
    const CORPUS = "completed, results-posted trials";
    const sections = [
      analyticsTableHtml("Signal rate by sponsor (≥5 trials)",
        "Of this sponsor's " + CORPUS + " in the corpus, the share with a signal finding.",
        "Sponsor", data.signalRateBySponsor,
        "sponsor", "signalTrials", "totalTrials", (r) => "sponsor=" + encodeURIComponent(r.sponsor)),
      analyticsTableHtml("Signal rate by sponsor class",
        "Of all " + CORPUS + " in this sponsor class, the share with a signal finding.",
        "Sponsor class", data.bySponsorClass,
        "sponsorClass", "signalTrials", "totalTrials", (r) => "sponsorClass=" + encodeURIComponent(r.sponsorClass)),
      analyticsTableHtml("Signal rate by phase",
        "Of all " + CORPUS + " in this phase, the share with a signal finding.",
        "Phase", data.byPhase,
        "phase", "signalTrials", "totalTrials", (r) => "phase=" + encodeURIComponent(r.phase)),
      analyticsTableHtml("Signal rate by year first posted",
        "Of all " + CORPUS + " first posted that year, the share with a signal finding.",
        "Year", data.byYear,
        "year", "signalTrials", "totalTrials", null),
      analyticsTableHtml("Top conditions",
        "Of all " + CORPUS + " listing this condition, the share with a signal finding.",
        "Condition", data.topConditions,
        "condition", "signalTrials", "totalTrials", null),
      analyticsTableHtml("Timing of primary-outcome changes, relative to enrolment",
        "Share of every finding in the corpus, signals and context alike, not of trials.",
        "Days after enrolment", data.timingHistogram,
        "bucket", "count", "total", null),
      analyticsTableHtml("Adjudication concern mix",
        "Share of every adjudicated finding; findings the reviewer never returned a verdict on are excluded.",
        "Concern level", data.adjudicationConcernMix,
        "concern", "count", "total", null),
    ].join("");

    setView("analytics",
      '<main class="view-enter analytics-view">' +
        '<section class="masthead view-head">' +
          '<p class="eyebrow">Registry change monitor — analytics</p>' +
          "<h1>Sponsor analytics</h1>" +
        "</section>" +
        ctisNote +
        sponsorNote +
        sections +
        footerHtml() +
      "</main>");

    document.querySelectorAll(".drill-row").forEach((tr) => {
      const go = () => { location.hash = tr.dataset.href; };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
  }

/* =========================================================================
   6. TRIAL VIEW — the scrubber
   ========================================================================= */
  let activeScrubber = null; // {next(), prev()} for the currently mounted trial view, or null

  function nodePercent(i, n) {
    if (n <= 1) return 50;
    const pad = 7;
    return pad + (i / (n - 1)) * (100 - 2 * pad);
  }

  // Places a reference date honestly relative to the (evenly spaced) version
  // nodes by interpolating between whichever two fetched versions bracket it.
  function refLinePercent(dateISO, versions) {
    const t = new Date(dateISO).getTime();
    const n = versions.length;
    if (t <= new Date(versions[0].date).getTime()) return nodePercent(0, n);
    if (t >= new Date(versions[n - 1].date).getTime()) return nodePercent(n - 1, n);
    for (let i = 0; i < n - 1; i++) {
      const t0 = new Date(versions[i].date).getTime();
      const t1 = new Date(versions[i + 1].date).getTime();
      if (t >= t0 && t <= t1) {
        const frac = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
        return nodePercent(i, n) + frac * (nodePercent(i + 1, n) - nodePercent(i, n));
      }
    }
    return 50;
  }

  // Verified against the live Record History "Compare" flow (2026-08-08, see
  // ctcm/api.py:_compare_url — same formula, kept in sync by hand since there's
  // no shared module between Python and this file): a/b are 1-indexed display
  // versions, int-API version 0 == displayed "Version 1".
  function compareUrl(trial, vFrom, vTo) {
    return trial.historyUrl + "&a=" + (vFrom + 1) + "&b=" + (vTo + 1) + "#version-content-panel";
  }

  // ---- Published reports (Task 13) ----------------------------------------------
  // Tier badge copy is deliberate, per ctcm/publink.py's tier definitions: HIGH is a
  // curated PubMed databank-accession linkage, MEDIUM is an NCT ID in the paper's own
  // abstract, LOW is any indexed mention at all (10-40x noisier) -- LOW must never
  // read as "the trial's paper," only as "mentions this trial."
  function pubTierLabel(tier) {
    if (tier === "HIGH") return "Trial report";
    if (tier === "MEDIUM") return "Likely trial report";
    return "Mentions this trial";
  }

  function publicationRowHtml(p) {
    const link = p.doi ? "https://doi.org/" + encodeURIComponent(p.doi)
      : p.pmid ? "https://pubmed.ncbi.nlm.nih.gov/" + encodeURIComponent(p.pmid) + "/"
      : null;
    const titleHtml = escapeHtml(p.title || "(title unavailable)");
    const titleEl = link
      ? '<a href="' + link + '" target="_blank" rel="noopener">' + titleHtml + "</a>"
      : titleHtml;
    const meta = [p.journal, p.pubDate].filter(Boolean).map(escapeHtml).join(" · ");
    return (
      '<li class="pub-row">' +
        '<span class="pub-tier pub-tier-' + p.tier.toLowerCase() + '">' + pubTierLabel(p.tier) + "</span>" +
        '<span class="pub-title">' + titleEl + "</span>" +
        (meta ? '<span class="pub-meta mono">' + meta + "</span>" : "") +
        (p.oa ? '<span class="pub-oa mono">open access</span>' : "") +
        // Factual date arithmetic only (ctcm.publink.days_after_change) -- never a
        // claim about what the paper says.
        (p.timingNote ? '<p class="pub-timing">' + escapeHtml(p.timingNote) + "</p>" : "") +
      "</li>"
    );
  }

  function publishedReportsHtml(trial) {
    const pubs = trial.publications || [];
    if (!pubs.length) return "";
    return (
      '<section class="card published-reports" aria-label="Published reports">' +
        '<p class="card-label">Published reports</p>' +
        '<ul class="pub-list">' + pubs.map(publicationRowHtml).join("") + "</ul>" +
      "</section>"
    );
  }

  // The banner reads /api/trials/{nct}.headlineFinding verbatim -- the ranking that
  // picked it is the API's (ctcm/api.py:_headline_key) and is deliberately not
  // re-derived here, so the trial page and the ledger row can never disagree about
  // which finding is the headline. Red is spent on the Signal tag only: the frame
  // stays rule-grey, because the changed record text is what's red in this brand.
  function findingBannerHtml(hf) {
    if (!hf) return "";
    const severityTag = hf.severity
      ? '<span class="tag severity-' + escapeHtml(hf.severity.toLowerCase()) + '" title="' + escapeHtml(hf.severity) +
        '">' + escapeHtml(label("severity", hf.severity)) + "</span>"
      : "";
    const timing = hf.daysAfterEnrolment != null
      ? '<span class="finding-timing" title="' + escapeHtml(fmtDaysAfterEnrolment(hf.daysAfterEnrolment)) + '">' +
          escapeHtml(fmtTimingProse(hf.daysAfterEnrolment)) + "</span>"
      : "";
    return (
      '<section class="finding-banner" aria-label="Headline finding">' +
        severityTag +
        labelHtml("changeType", hf.changeType, "finding-change") +
        timing +
        (hf.rationale ? '<p class="finding-rationale">' + escapeHtml(rationaleProse(hf.rationale)) + "</p>" : "") +
        adjudicationLineHtml(hf.adjudication) +
      "</section>"
    );
  }

  async function renderTrialView(nctId) {
    setView("trials", "<main>" + loadingHtml(nctId) + "</main>");

    let trial;
    try {
      trial = await getTrial(nctId);
    } catch (err) {
      setView("trials", '<main class="view-enter trial-view"><a class="back-link" href="#/trials">&larr; Trial index</a>' +
        errorHtml(err, route) + footerHtml() + "</main>");
      return;
    }
    if (!trial) {
      setView("trials", '<main class="view-enter"><a class="back-link" href="#/trials">&larr; Trial index</a>' +
        '<p class="status-note">No trial found for ' + escapeHtml(nctId) + ".</p>" +
        footerHtml() + "</main>");
      return;
    }

    const n = trial.versions.length;
    const signalVersions = new Set((trial.findings || []).filter((f) => f.severity === "SIGNAL").map((f) => f.toVersion));
    const nodesHtml = trial.versions.map((v, i) =>
      '<div class="v-marker" style="left:' + nodePercent(i, n) + '%">' +
        '<button class="v-node' + (signalVersions.has(v.version) ? " has-signal" : "") + '" data-index="' + i +
          '" aria-pressed="false" aria-label="Version ' + v.version + ", " + v.date +
          (signalVersions.has(v.version) ? " (flagged change)" : "") + '"></button>' +
        '<span class="v-label mono">v' + v.version + "</span>" +
      "</div>"
    ).join("");

    const enrolPct = trial.enrolmentStart ? refLinePercent(trial.enrolmentStart, trial.versions) : null;
    const compPct = trial.primaryCompletion ? refLinePercent(trial.primaryCompletion, trial.versions) : null;

    setView("trials",
      '<main class="view-enter trial-view">' +
        '<a class="back-link" href="#/trials">&larr; Trial index</a>' +
        '<div class="trial-header">' +
          '<div class="trial-id-row">' +
            '<span class="nct-id mono">' + trial.nctId + "</span>" +
            '<span class="status-pill" id="status-pill"></span>' +
          "</div>" +
          '<h1 class="trial-title">' + escapeHtml(trial.briefTitle || trial.nctId) + "</h1>" +
          (trial.officialTitle ? '<p class="trial-official">' + escapeHtml(trial.officialTitle) + "</p>" : "") +
          '<div class="trial-meta">' +
            "<span><strong>" + escapeHtml(trial.sponsor || "Sponsor unknown") + "</strong></span>" +
            "<span>" + phaseLabel(trial.phase) + "</span>" +
            "<span>Enrolment began <strong class=\"mono\">" + (trial.enrolmentStart || "unknown") + "</strong>" +
              (trial.enrolmentStartType ? " (" + trial.enrolmentStartType.toLowerCase() + ")" : "") + "</span>" +
            "<span>Primary completion <strong class=\"mono\">" + (trial.primaryCompletion || "unknown") + "</strong>" +
              (trial.primaryCompletionType ? " (" + trial.primaryCompletionType.toLowerCase() + ")" : "") + "</span>" +
            '<span><a class="mono" href="' + trial.historyUrl + '" target="_blank" rel="noopener">' +
              "clinicaltrials.gov/study/" + escapeHtml(trial.nctId) + "</a></span>" +
          "</div>" +
        "</div>" +

        findingBannerHtml(trial.headlineFinding) +

        '<section class="scrubber" aria-label="Version scrubber">' +
          '<div class="scrubber-scroll"><div class="scrubber-track">' +
            '<div class="timeline-baseline"></div>' +
            (enrolPct != null ? '<div class="ref-line" style="left:' + enrolPct + '%"><span class="ref-label">Enrolment began</span></div>' : "") +
            (compPct != null ? '<div class="ref-line" style="left:' + compPct + '%"><span class="ref-label">Primary completion</span></div>' : "") +
            nodesHtml +
            '<div class="playhead" id="playhead" style="left:' + nodePercent(0, n) + '%"></div>' +
          "</div></div>" +
        "</section>" +

        // aria-live: the version can change from the track, the arrow keys or the
        // stepper, and only the readout says which version you landed on.
        '<div class="readout" aria-live="polite">' +
          '<button class="stepper" id="step-prev" aria-label="Previous version">&lsaquo;</button>' +
          '<span class="readout-version mono" id="readout-version"></span>' +
          '<button class="stepper" id="step-next" aria-label="Next version">&rsaquo;</button>' +
          '<span class="readout-date mono" id="readout-date"></span>' +
          '<span class="readout-days mono" id="readout-days"></span>' +
          '<span class="readout-reslink" id="readout-reslink"></span>' +
          '<span class="readout-status" id="readout-status"></span>' +
        "</div>" +

        '<p class="diff-legend"><del>struck</del> = removed · <ins>underlined</ins> = added</p>' +

        '<div class="outcome-panel">' +
          '<div class="card primary-card">' +
            '<p class="card-label">Primary outcome</p>' +
            '<p class="primary-measure" id="primary-measure"></p>' +
            '<p class="primary-timeframe mono" id="primary-timeframe"></p>' +
            '<p class="change-stamp" id="change-stamp"></p>' +
            '<p class="primary-description" id="primary-description"></p>' +
            '<div class="primary-extra" id="primary-extra" hidden></div>' +
            '<p class="deep-links" id="deep-links"></p>' +
          "</div>" +
          '<div class="card">' +
            '<p class="card-label">Secondary outcomes (<span id="secondary-count"></span>)</p>' +
            '<ul class="secondary-list" id="secondary-list"></ul>' +
            '<div class="secondary-removed" id="secondary-removed" hidden>' +
              '<p class="card-label">No longer measured</p>' +
              "<ul></ul>" +
            "</div>" +
          "</div>" +
        "</div>" +
        publishedReportsHtml(trial) +
        footerHtml() +
      "</main>");

    initScrubber(trial);
  }

  function initScrubber(trial) {
    const n = trial.versions.length;
    const track = document.querySelector(".scrubber-track");
    const playhead = document.getElementById("playhead");
    const nodeButtons = [...track.querySelectorAll(".v-node")];
    const stepPrev = document.getElementById("step-prev");
    const stepNext = document.getElementById("step-next");
    let idx = 0;

    function select(i, opts) {
      idx = Math.max(0, Math.min(n - 1, i));
      nodeButtons.forEach((b, j) => b.setAttribute("aria-pressed", j === idx));
      // While dragging, the playhead belongs to the pointer (see below) — moving it
      // to the node here would make it snap away from the cursor mid-drag.
      if (!dragging) playhead.style.left = nodePercent(idx, n) + "%";
      stepPrev.disabled = idx === 0;
      stepNext.disabled = idx === n - 1;
      renderOutcomePanel(trial, idx);
      if (opts && opts.focus) nodeButtons[idx].focus();
    }

    nodeButtons.forEach((b, i) => b.addEventListener("click", () => select(i)));
    stepPrev.addEventListener("click", () => select(idx - 1));
    stepNext.addEventListener("click", () => select(idx + 1));

    function xToPercent(clientX) {
      const rect = track.getBoundingClientRect();
      return ((clientX - rect.left) / rect.width) * 100;
    }

    function nearestIndex(pct) {
      let best = 0, bestDist = Infinity;
      trial.versions.forEach((_, i) => {
        const d = Math.abs(nodePercent(i, n) - pct);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }

    // Dragging: the playhead tracks the pointer 1:1 (clamped to the track's padded
    // range) while the selected version switches at the midpoint between nodes; on
    // release the playhead settles onto the selected node.
    let dragging = false;
    function dragTo(clientX) {
      const pct = xToPercent(clientX);
      playhead.style.left = Math.max(nodePercent(0, n), Math.min(nodePercent(n - 1, n), pct)) + "%";
      const near = nearestIndex(pct);
      if (near !== idx) select(near);
    }
    track.addEventListener("pointerdown", (e) => {
      dragging = true;
      track.classList.add("dragging");
      track.setPointerCapture(e.pointerId);
      dragTo(e.clientX);
    });
    track.addEventListener("pointermove", (e) => { if (dragging) dragTo(e.clientX); });
    ["pointerup", "pointercancel"].forEach((ev) => track.addEventListener(ev, () => {
      if (!dragging) return;
      dragging = false;
      track.classList.remove("dragging");
      playhead.style.left = nodePercent(idx, n) + "%";
    }));

    activeScrubber = {
      next: () => select(idx + 1, { focus: true }),
      prev: () => select(idx - 1, { focus: true })
    };

    select(0);
  }

  // Single persistent listener (not re-added per render) driven by activeScrubber,
  // which is null whenever no trial view is mounted.
  window.addEventListener("keydown", (e) => {
    if (!activeScrubber) return;
    if (e.key === "ArrowRight") { activeScrubber.next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { activeScrubber.prev(); e.preventDefault(); }
  });

  function timingClass(daysAfterEnrolment, daysAfterCompletion) {
    if (daysAfterCompletion > 0) return "after-completion";
    if (daysAfterEnrolment >= 0) return "after-enrolment";
    return "";
  }

  // "CHANGED 6 DECEMBER 2012 · 238 DAYS BEFORE THE TRIAL ENDED · WHILE STILL RUNNING"
  // — the provenance stamp shown under the primary outcome on any version a SIGNAL
  // finding points at. Uppercasing comes from the metadata voice CSS, not the string.
  const MONTHS = ["January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"];
  const RUNNING_STATUSES = new Set(["RECRUITING", "ACTIVE_NOT_RECRUITING", "ENROLLING_BY_INVITATION"]);

  function changeStampText(finding, versionDate, overallStatus) {
    const [y, m, d] = versionDate.split("-").map(Number);
    const parts = ["Changed " + d + " " + MONTHS[m - 1] + " " + y];
    const dpc = finding.daysAfterPrimaryCompletion;
    if (dpc != null && dpc !== 0) {
      parts.push(Math.abs(dpc) + " days " + (dpc < 0 ? "before" : "after") + " the trial ended");
    }
    if (dpc != null && dpc <= 0 && RUNNING_STATUSES.has(overallStatus)) {
      parts.push("while still running");
    }
    return parts.join(" · ");
  }

  function diffSecondaryList(prevList, curList) {
    const prevMeasures = new Set((prevList || []).map((o) => o.measure));
    const removed = (prevList || []).filter((o) => !curList.some((c) => c.measure === o.measure));
    return { removed, isNew: (o) => prevList !== null && !prevMeasures.has(o.measure) };
  }

  function renderOutcomePanel(trial, idx) {
    const cur = trial.versions[idx];
    const prev = idx > 0 ? trial.versions[idx - 1] : null;
    const daysAfterEnrolment = trial.enrolmentStart ? daysBetween(cur.date, trial.enrolmentStart) : null;
    const daysAfterCompletion = trial.primaryCompletion ? daysBetween(cur.date, trial.primaryCompletion) : null;

    document.getElementById("readout-version").textContent = "v" + cur.version;
    document.getElementById("readout-date").textContent = cur.date;
    const daysEl = document.getElementById("readout-days");
    daysEl.textContent = daysAfterEnrolment != null ? fmtDaysAfterEnrolment(daysAfterEnrolment) : "enrolment date unknown";
    daysEl.className = "readout-days mono " + (daysAfterEnrolment != null ? timingClass(daysAfterEnrolment, daysAfterCompletion) : "");
    const statusText = label("status", cur.overallStatus);
    [document.getElementById("readout-status"), document.getElementById("status-pill")].forEach((el) => {
      el.textContent = statusText;
      el.title = cur.overallStatus || "";
    });

    const curP = cur.primaryOutcomes[0] || { measure: "—", description: "", timeFrame: "—" };
    const prevP = prev ? (prev.primaryOutcomes[0] || { measure: "", description: "", timeFrame: "" }) : null;
    document.getElementById("primary-measure").innerHTML = renderDiff(prevP && prevP.measure, curP.measure);
    document.getElementById("primary-timeframe").innerHTML = renderDiff(prevP && prevP.timeFrame, curP.timeFrame);
    document.getElementById("primary-description").innerHTML = renderDiff(prevP && prevP.description, curP.description);

    // "results-posting edit": this version is the to_version of a results-linked
    // finding (ctcm/reslink.py) -- the edit coincides with the sponsor posting
    // results, registry restructuring rather than an outcome switch. resultsLinked
    // is true/false/null from the API (null = undetermined -> no tag, same as false);
    // DEMO's TRIAL_DATA carries no findings array, so this stays empty there.
    const resultsLinkedHere = (trial.findings || []).some((f) => f.resultsLinked === true && f.toVersion === cur.version);
    document.getElementById("readout-reslink").textContent = resultsLinkedHere ? "results-posting edit" : "";

    // Provenance stamp: which SIGNAL finding, if any, lands on this exact version.
    const stampEl = document.getElementById("change-stamp");
    const stampFinding = (trial.findings || []).find(
      (f) => f.toVersion === cur.version && f.severity === "SIGNAL");
    stampEl.textContent = stampFinding ? changeStampText(stampFinding, cur.date, cur.overallStatus) : "";
    stampEl.classList.toggle("visible", !!stampFinding);

    const extraEl = document.getElementById("primary-extra");
    const extras = cur.primaryOutcomes.slice(1);
    if (extras.length) {
      extraEl.hidden = false;
      extraEl.innerHTML = '<p class="card-label">Additional primary outcomes</p>' +
        extras.map((o) => '<p class="primary-extra-item">' + escapeHtml(o.measure) +
          '<span class="badge">' + escapeHtml(o.timeFrame) + "</span></p>").join("");
    } else {
      extraEl.hidden = true;
    }

    const { removed, isNew } = diffSecondaryList(prev ? prev.secondaryOutcomes : null, cur.secondaryOutcomes);
    document.getElementById("secondary-count").textContent = cur.secondaryOutcomes.length;
    document.getElementById("secondary-list").innerHTML = cur.secondaryOutcomes.map((o) =>
      '<li class="' + (isNew(o) ? "is-new" : "") + '"><span class="sec-measure">' + escapeHtml(o.measure) +
      '</span><span class="sec-timeframe mono">' + escapeHtml(o.timeFrame || "") + "</span></li>"
    ).join("");
    const removedWrap = document.getElementById("secondary-removed");
    if (removed.length) {
      removedWrap.hidden = false;
      removedWrap.querySelector("ul").innerHTML = removed.map((o) =>
        "<li><del>" + escapeHtml(o.measure) + "</del></li>").join("");
    } else {
      removedWrap.hidden = true;
    }

    const linksEl = document.getElementById("deep-links");
    linksEl.innerHTML = prev
      ? "Compare on ClinicalTrials.gov: " +
        '<a href="' + compareUrl(trial, prev.version, cur.version) + '" target="_blank" rel="noopener">v' + prev.version + " · " + prev.date + "</a> vs " +
        '<a href="' + compareUrl(trial, prev.version, cur.version) + '" target="_blank" rel="noopener">v' + cur.version + " · " + cur.date + " ↗</a>"
      : "View on ClinicalTrials.gov: " +
        '<a href="' + trial.historyUrl + "&a=" + (cur.version + 1) + '#version-content-panel" target="_blank" rel="noopener">v' +
          cur.version + " · " + cur.date + " ↗</a>";
  }

/* =========================================================================
   7. MOTION (v0.8) — the dashboard's corpus field (three.js over CDN,
      decorative only) and the one counted number. Everything here degrades to
      the same static page: offline, no WebGL, or prefers-reduced-motion all
      just mean "skip it".
   ========================================================================= */
  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)");

  function animateCount(el, to) {
    if (!el) return;
    if (REDUCED_MOTION.matches || !(to > 1)) { el.textContent = to; return; }
    const dur = 900;
    const t0 = performance.now();
    (function tick(t) {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); // ease-out cubic
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  let heroFieldStop = null;  // route() calls this when the dashboard unmounts
  let heroFieldTheme = null; // theme toggle calls this to re-read palette tokens

  function themeToken(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // The corpus as drifting lines of the public record: short near-horizontal
  // strokes — most in paper at low opacity, a few struck in Redline red, which
  // keeps the brand rule (red = changed record) even in ornament.
  async function initHeroField(canvas) {
    let THREE;
    try {
      THREE = await import("https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js");
    } catch (e) {
      return; // offline or a blocked CDN: the hero stays a static panel
    }
    if (!canvas || !canvas.isConnected) return; // navigated away while the module loaded

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    } catch (e) {
      return; // no WebGL context to be had — same static panel
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.z = 11;

    function strokes(count) {
      const pos = new Float32Array(count * 6);
      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 22;
        const y = (Math.random() - 0.5) * 10;
        const z = (Math.random() - 0.5) * 8;
        const len = 0.35 + Math.random() * 1.1;
        const tilt = (Math.random() - 0.5) * 0.12;
        pos.set([x - len, y - len * tilt, z, x + len, y + len * tilt, z], i * 6);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      return g;
    }
    const paperMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.16 });
    const redMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.5 });
    const field = new THREE.Group();
    field.add(new THREE.LineSegments(strokes(340), paperMat));
    field.add(new THREE.LineSegments(strokes(46), redMat));
    scene.add(field);

    heroFieldTheme = () => {
      paperMat.color.set(themeToken("--paper") || "#F5F1EA");
      redMat.color.set(themeToken("--redline") || "#C4302B");
      renderer.render(scene, camera);
    };

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(() => { resize(); renderer.render(scene, camera); });
    ro.observe(canvas);
    resize();
    heroFieldTheme();

    function cleanup() {
      ro.disconnect();
      renderer.dispose();
      heroFieldTheme = null;
    }

    if (REDUCED_MOTION.matches) { // one honest still frame, no loop
      heroFieldStop = cleanup;
      return;
    }

    let targetX = 0, targetY = 0;
    const hero = canvas.parentElement;
    hero.addEventListener("pointermove", (e) => {
      const r = hero.getBoundingClientRect();
      targetY = ((e.clientX - r.left) / r.width - 0.5) * 0.35;
      targetX = ((e.clientY - r.top) / r.height - 0.5) * 0.2;
    });

    let raf;
    function frame(t) {
      const drift = t * 0.00003; // slow constant spin, plus pointer parallax
      field.rotation.y += (drift + targetY - field.rotation.y) * 0.05;
      field.rotation.x += (targetX - field.rotation.x) * 0.05;
      redMat.opacity = 0.38 + 0.18 * Math.sin(t * 0.0012); // the red strokes breathe
      renderer.render(scene, camera);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    heroFieldStop = () => { cancelAnimationFrame(raf); cleanup(); };
  }

  // "/" focuses the ledger search wherever it's on screen — the one keyboard
  // affordance every index-shaped app is expected to have.
  window.addEventListener("keydown", (e) => {
    if (e.key !== "/" || (e.target.closest && e.target.closest("input, select, textarea"))) return;
    const search = document.getElementById("index-search");
    if (search) { search.focus(); e.preventDefault(); }
  });
</script>
</body>
</html>
