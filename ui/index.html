<!doctype html>
<!--
  Redline — timeline scrubber prototype (Task 11).
  Single self-contained file: vanilla HTML/CSS/JS, no build step, no external CDNs.

  Design tokens (see ui-report.md for full rationale):
    Palette   --paper #EDF0F0 · --paper-raised #FFFFFF · --ink #171B1F · --ink-muted #5B6570
              --accent #21508C (registry stamp blue) · --flag #9C2B3B (redline brick red)
    Type      --mono  (registry IDs, dates, version tags — the "case-file" voice)
              --sans  (prose — outcome text, headings)
    Layout    Document/ledger metaphor: masthead strip, ruled table, case-report cards.
    Signature The scrubber: a ruler-like track with true-to-date reference lines (dashed)
              and evenly spaced, keyboard- and drag-operable version nodes.
    Motion    One moment only — word-diff marks (<ins>/<del>) fade in when the selection
              changes; respects prefers-reduced-motion.

  Data-access seam: the ENTIRE app reads trial data through getTrial(nctId) and
  fetchIndex(params) below. Both call the v0.6 API (ctcm/api.py) first; if the fetch
  fails (e.g. this file opened directly as file://, no server), they fall back to the
  embedded TRIAL_DATA constant so the file still demos standalone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline — Clinical Trial Registry Change Monitor</title>
<style>
  :root {
    --paper: #EDF0F0;
    --paper-raised: #FFFFFF;
    --ink: #171B1F;
    --ink-muted: #5B6570;
    --line: #C7CDD2;
    --accent: #21508C;
    --accent-soft: #DCE6F2;
    --flag: #9C2B3B;
    --flag-soft: #F3DEE1;
    --neutral-soft: #E4E7E7;
    --focus: #21508C;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15191C;
      --paper-raised: #1D2327;
      --ink: #E8ECEE;
      --ink-muted: #97A2A9;
      --line: #343C41;
      --accent: #7FAEE6;
      --accent-soft: #22344A;
      --flag: #E2909B;
      --flag-soft: #3D232A;
      --neutral-soft: #262C2F;
      --focus: #7FAEE6;
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 700; margin: 0; }
  p { margin: 0; }
  a { color: var(--accent); }
  ul { margin: 0; padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  :focus { outline: none; }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- topbar (shared) ---------- */
  .topbar {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
  }
  .brand {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .02em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand:hover { color: var(--accent); }
  .brand-sub {
    font-size: .8rem;
    color: var(--ink-muted);
  }

  main { max-width: 78rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ---------- index view ---------- */
  .masthead { padding: .5rem 0 2rem; border-bottom: 1px solid var(--line); margin-bottom: 1.75rem; }
  .eyebrow {
    font-family: var(--mono);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-muted);
    margin-bottom: .6rem;
  }
  .masthead h1 {
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    line-height: 1.25;
    max-width: 42rem;
  }
  .masthead h1 .counter {
    font-family: var(--mono);
    color: var(--accent);
  }
  .tagline { margin-top: .75rem; color: var(--ink-muted); font-size: .95rem; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: .8rem 1.4rem;
    margin-bottom: 1.5rem;
  }
  .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
  .filter-label {
    font-family: var(--mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-muted);
    margin-right: .15rem;
  }
  .chip {
    font-family: var(--mono);
    font-size: .8rem;
    padding: .3rem .7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-raised);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .search-group { flex: 1 1 16rem; display: flex; align-items: center; gap: .4rem; margin-left: auto; }
  .search-input {
    flex: 1;
    max-width: 20rem;
    font: inherit;
    font-family: var(--mono);
    font-size: .85rem;
    padding: .4rem .7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .search-input::placeholder { color: var(--ink-muted); }
  .search-input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  .status-note { font-size: .85rem; color: var(--ink-muted); padding: 1.5rem 0; }

  /* ---------- case studies strip ---------- */
  .case-studies { margin-bottom: 2rem; }
  .case-studies-heading {
    font-family: var(--mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-muted);
    margin-bottom: .7rem;
  }
  .case-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    gap: .9rem;
  }
  .case-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--flag);
    border-radius: var(--radius);
    padding: .9rem 1.05rem;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .case-card:hover { border-left-color: var(--accent); background: var(--accent-soft); }
  .case-card-id { font-family: var(--mono); font-weight: 700; font-size: .82rem; }
  .case-card-story { font-size: .85rem; margin-top: .35rem; color: var(--ink); }
  .case-card-adjudication { font-size: .8rem; margin-top: .5rem; color: var(--ink-muted); }
  .case-card-adjudication b { color: var(--ink); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-raised); }
  table.ledger { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 46rem; }
  table.ledger th, table.ledger td { padding: .7rem .9rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.ledger th {
    font-family: var(--mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-muted);
    cursor: pointer;
    user-select: none;
  }
  table.ledger th:hover { color: var(--ink); }
  table.ledger th .sort-arrow { opacity: .5; margin-left: .2rem; }
  table.ledger tbody tr { cursor: pointer; }
  table.ledger tbody tr:hover { background: var(--accent-soft); }
  table.ledger tbody tr:last-child td { border-bottom: none; }
  .nct-link { font-family: var(--mono); font-weight: 600; }
  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .72rem;
    padding: .15rem .5rem;
    border-radius: 4px;
  }
  .tag.severity-signal { background: var(--flag-soft); color: var(--flag); }
  .empty-row td { text-align: center; color: var(--ink-muted); padding: 2rem; white-space: normal; }

  /* ---------- trial view ---------- */
  .back-link {
    display: inline-block;
    font-family: var(--mono);
    font-size: .82rem;
    color: var(--ink-muted);
    text-decoration: none;
    margin-bottom: 1.25rem;
  }
  .back-link:hover { color: var(--accent); }

  .trial-header { padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
  .trial-id-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .nct-id { font-family: var(--mono); font-weight: 700; font-size: 1.05rem; }
  .status-pill {
    font-family: var(--mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: .15rem .55rem;
    border-radius: 4px;
    background: var(--neutral-soft);
    color: var(--ink-muted);
  }
  .trial-title { font-size: 1.4rem; margin-bottom: .3rem; }
  .trial-official { color: var(--ink-muted); font-size: .88rem; max-width: 52rem; margin-bottom: .6rem; }
  .trial-meta { display: flex; flex-wrap: wrap; gap: 1.4rem; font-size: .85rem; color: var(--ink-muted); }
  .trial-meta strong { color: var(--ink); font-weight: 600; }

  /* the scrubber: signature element */
  .scrubber { margin-bottom: 1.5rem; }
  .scrubber-scroll { overflow-x: auto; padding: 0 .25rem; }
  .scrubber-track {
    position: relative;
    height: 108px;
    min-width: 30rem;
    margin: 0 .5rem;
    touch-action: none;
  }
  .timeline-baseline {
    position: absolute;
    left: 6%; right: 6%; top: 58px;
    height: 2px;
    background: var(--line);
  }
  .ref-line {
    position: absolute;
    top: 14px; bottom: 14px;
    width: 0;
    border-left: 2px dashed var(--ink-muted);
    transform: translateX(-1px);
  }
  .ref-label {
    position: absolute;
    top: -2px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: .66rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--ink-muted);
    white-space: nowrap;
    background: var(--paper);
    padding: 0 .3rem;
  }
  .v-marker {
    position: absolute;
    top: 58px;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .4rem;
  }
  .v-node {
    position: relative;
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--paper-raised);
    cursor: pointer;
    padding: 0;
  }
  .v-node[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .v-node:hover { border-color: var(--accent); }
  .v-node.has-signal { border-color: var(--flag); }
  .v-node.has-signal::after {
    content: "";
    position: absolute;
    top: -5px; right: -5px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--flag);
  }
  .v-label {
    position: absolute;
    top: 20px;
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .playhead {
    position: absolute;
    top: 8px; bottom: 8px;
    width: 3px;
    background: var(--accent);
    transform: translateX(-50%);
    pointer-events: none;
    border-radius: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .playhead { transition: left .12s ease-out; }
  }

  .readout {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: .6rem;
    padding: .9rem 1rem;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 2rem;
  }
  .readout-version { font-family: var(--mono); font-weight: 700; font-size: 1.3rem; }
  .readout-date { font-family: var(--mono); font-size: 1.05rem; color: var(--ink-muted); }
  .readout-days {
    font-family: var(--mono);
    font-size: .82rem;
    padding: .2rem .6rem;
    border-radius: 4px;
    background: var(--neutral-soft);
    color: var(--ink-muted);
  }
  .readout-days.after-enrolment { background: var(--accent-soft); color: var(--accent); }
  .readout-days.after-completion { background: var(--flag-soft); color: var(--flag); }
  .readout-status { margin-left: auto; font-size: .8rem; color: var(--ink-muted); }

  .outcome-panel { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 62rem) { .outcome-panel { grid-template-columns: 1fr; } }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
  }
  .card-label {
    font-family: var(--mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-muted);
    margin-bottom: .5rem;
  }
  .primary-card { border-left: 4px solid var(--accent); }
  .primary-measure { font-size: 1.15rem; font-weight: 600; margin-bottom: .5rem; }
  .primary-timeframe { font-family: var(--mono); font-size: .82rem; color: var(--ink-muted); margin-bottom: .8rem; }
  .primary-description { font-size: .92rem; white-space: pre-line; }
  .primary-extra { margin-top: 1rem; padding-top: .9rem; border-top: 1px dashed var(--line); }
  .primary-extra-item { font-size: .85rem; margin-bottom: .3rem; }
  .primary-extra-item .badge {
    font-family: var(--mono);
    font-size: .65rem;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-left: .4rem;
  }

  ins, del { text-decoration: none; }
  ins { background: var(--accent-soft); color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  del { background: var(--flag-soft); color: var(--flag); text-decoration: line-through; }
  @media (prefers-reduced-motion: no-preference) {
    .primary-card ins, .primary-card del,
    .secondary-list ins, .secondary-list del,
    .secondary-list li.is-new {
      animation: markReveal .5s ease-out;
    }
  }
  @keyframes markReveal { from { opacity: 0; } to { opacity: 1; } }

  .secondary-list { max-height: 26rem; overflow-y: auto; }
  .secondary-list li {
    display: flex;
    justify-content: space-between;
    gap: .8rem;
    font-size: .85rem;
    padding: .45rem 0;
    border-bottom: 1px solid var(--line);
  }
  .secondary-list li:last-child { border-bottom: none; }
  .secondary-list li.is-new { background: var(--accent-soft); margin: 0 -.6rem; padding: .45rem .6rem; border-radius: 4px; border-bottom-color: transparent; }
  .sec-measure { flex: 1; }
  .sec-timeframe { font-family: var(--mono); color: var(--ink-muted); white-space: nowrap; font-size: .78rem; }
  .is-new .sec-measure::after {
    content: "new";
    font-family: var(--mono);
    font-size: .62rem;
    text-transform: uppercase;
    color: var(--accent);
    margin-left: .5rem;
    vertical-align: middle;
  }
  .secondary-removed { margin-top: .9rem; padding-top: .9rem; border-top: 1px dashed var(--line); }
  .secondary-removed .card-label { color: var(--flag); }
  .secondary-removed li { border-bottom: none; padding: .2rem 0; }

  .deep-links {
    margin-top: 1.5rem;
    font-size: .85rem;
    color: var(--ink-muted);
  }
  .deep-links a { margin: 0 .2rem; }

  @media (max-width: 30rem) {
    main { padding: 1.25rem 1rem 3rem; }
    .filters { gap: .6rem 1rem; }
  }
</style>
</head>

/* =========================================================================
   2. DATA ACCESS — fetch the v0.6 API; fall back to embedded DEMO data if
      there's no API to ask (this file opened as file://, or served standalone
      by something other than ctcm.api without the backend behind it).

      Whether the API exists at all is probed once via /healthz and cached, then
      gates every other call. This has to be a separate probe rather than "did
      /api/trials/{nct} 404" -- a real 404 from the real API (unknown NCT id) and
      a 404 from, say, a plain static file server with no backend at all are the
      same HTTP status and are NOT the same situation: one is an honest answer
      ("no such trial"), the other means DEMO fallback. Conflating them was a
      real bug caught in browser verification (serving ui/ over a bare static
      server showed "No trial found for NCT04280705" instead of the DEMO row).
   ========================================================================= */
  let apiAvailable = null;
  async function checkApiAvailable() {
    if (apiAvailable !== null) return apiAvailable;
    try {
      const res = await fetch("/healthz");
      apiAvailable = res.ok;
    } catch (e) {
      apiAvailable = false;
    }
    return apiAvailable;
  }

  async function getTrial(nctId) {
    if (await checkApiAvailable()) {
      try {
        const res = await fetch("/api/trials/" + encodeURIComponent(nctId));
        if (res.ok) return res.json();
        if (res.status === 404) return null; // the real API's honest answer
      } catch (e) { /* network hiccup after all -- fall through to DEMO below */ }
    }
    return nctId === TRIAL_DATA.nctId ? TRIAL_DATA : null;
  }

  // Index rows the DEMO fallback shows when there's no server to ask: one row,
  // derived from TRIAL_DATA the same way the real API derives a headline finding
  // (severity/changeType/signalVersion stand in for the pipeline's pick).
  function demoIndexResponse() {
    const sv = TRIAL_DATA.versions.find((v) => v.version === TRIAL_DATA.signalVersion);
    const days = daysBetween(sv.date, TRIAL_DATA.enrolmentStart);
    const row = {
      nctId: TRIAL_DATA.nctId,
      sponsor: TRIAL_DATA.sponsor,
      sponsorClass: TRIAL_DATA.sponsorClass,
      phase: TRIAL_DATA.phase,
      conditions: ["COVID-19"],
      overallStatus: "COMPLETED",
      enrolmentCount: null,
      versionCount: TRIAL_DATA.versions.length,
      severity: TRIAL_DATA.severity,
      changeType: TRIAL_DATA.changeType,
      daysAfterEnrolment: days,
      daysAfterPrimaryCompletion: daysBetween(sv.date, TRIAL_DATA.primaryCompletion),
      rationale: "Primary outcome replaced " + days + " days after enrolment began (v0 → v" + TRIAL_DATA.signalVersion + ").",
      adjudication: null
    };
    return {
      rows: [row],
      total: 1,
      counts: { trials: 1, signalTrials: 1, postCompletionTrials: 0, caveat: "DEMO mode (no server) — showing embedded ACTT-1 data only." }
    };
  }

  async function fetchIndex(params) {
    if (await checkApiAvailable()) {
      const qs = new URLSearchParams();
      for (const [key, values] of Object.entries(params || {})) {
        (Array.isArray(values) ? values : [values]).forEach((v) => v && qs.append(key, v));
      }
      try {
        const res = await fetch("/api/trials?" + qs.toString());
        if (res.ok) return res.json();
      } catch (e) { /* fall through to DEMO below */ }
    }
    return demoIndexResponse();
  }

/* =========================================================================
   3. UTILITIES — dates, escaping, word-level LCS diff.
   ========================================================================= */
  function daysBetween(laterISO, earlierISO) {
    return Math.round((new Date(laterISO) - new Date(earlierISO)) / 86400000);
  }

  function fmtDaysAfterEnrolment(days) {
    if (days === 0) return "day enrolment began";
    if (days > 0) return "+" + days + " day" + (days === 1 ? "" : "s") + " after enrolment began";
    return Math.abs(days) + " day" + (Math.abs(days) === 1 ? "" : "s") + " before enrolment began";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // Word-level LCS diff. Tokenizes on whitespace boundaries (keeping the
  // whitespace as its own token) so re-joined output preserves spacing.
  // O(n*m) time/space — fine for outcome-text-length inputs (tens to low
  // hundreds of tokens); not meant for diffing whole documents.
  function tokenize(s) {
    return (s || "").match(/\s+|[^\s]+/g) || [];
  }

  function diffWords(oldText, newText) {
    const a = tokenize(oldText), b = tokenize(newText);
    const n = a.length, m = b.length;
    const dp = new Array(n + 1);
    for (let i = 0; i <= n; i++) dp[i] = new Uint16Array(m + 1);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push(["eq", a[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(["del", a[i]]); i++; }
      else { ops.push(["ins", b[j]]); j++; }
    }
    while (i < n) { ops.push(["del", a[i]]); i++; }
    while (j < m) { ops.push(["ins", b[j]]); j++; }
    return ops;
  }

  // Renders diffed HTML; with no previous text, renders plain (baseline version).
  //
  // ponytail: below a similarity threshold, skip the interleaved word diff and
  // show one <del> block + one <ins> block instead. Pure word-LCS on two
  // largely-unrelated passages (e.g. a fully replaced outcome description)
  // matches on stray stopwords ("the", "of", "is") and reads as noise right
  // where this UI most needs to read clean: a total rewrite. Upgrade path if
  // ever needed: a real similarity metric (e.g. token Jaccard) instead of the
  // matched-word ratio already sitting in the LCS ops.
  function renderDiff(oldText, newText) {
    if (oldText === null || oldText === undefined) return escapeHtml(newText || "");
    const ops = diffWords(oldText, newText);
    const wordCount = (t) => (t.match(/\S+/g) || []).length;
    const eqWords = ops.filter(([type, word]) => type === "eq" && word.trim() !== "").length;
    const totalWords = Math.max(wordCount(oldText), wordCount(newText));
    if (totalWords > 4 && eqWords / totalWords < 0.35) {
      return (oldText ? "<del>" + escapeHtml(oldText) + "</del> " : "") + "<ins>" + escapeHtml(newText || "") + "</ins>";
    }
    return ops.map(([type, word]) => {
      const safe = escapeHtml(word);
      if (type === "eq") return safe;
      return type === "del" ? "<del>" + safe + "</del>" : "<ins>" + safe + "</ins>";
    }).join("");
  }

/* =========================================================================
   4. ROUTER
   ========================================================================= */
  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);

  async function route() {
    const hash = location.hash || "#/";
    const m = hash.match(/^#\/trial\/([^/]+)/);
    activeScrubber = null; // leaving (or not yet on) the trial view disarms arrow-key scrubbing
    if (m) await renderTrialView(decodeURIComponent(m[1]));
    else await renderIndexView();
  }

  function topbarHtml() {
    return (
      '<header class="topbar">' +
        '<a class="brand" href="#/">Redline</a>' +
        '<span class="brand-sub">Clinical Trial Registry Change Monitor</span>' +
      "</header>"
    );
  }

/* =========================================================================
   5. INDEX VIEW — filter chips/search/sort drive server-side query params
      (api-brief: GET /api/trials?severity=&change_type=&...&sort=). One
      unfiltered fetch on load supplies the fixed chip-value lists and the case
      studies strip; every filter/sort/search change re-fetches just the table.
   ========================================================================= */
  function phaseLabel(p) {
    if (!p) return "—";
    if (p === "NA") return "N/A";
    return p.split(",").map((x) => x.replace("PHASE", "Phase ")).join(" / ");
  }

  // Top SIGNAL trials by |days after primary completion| — same ranking the API
  // uses to pick each row's headline finding, reused here to pick the strip.
  function pickCaseStudies(rows) {
    return rows
      .filter((r) => r.severity === "SIGNAL" && r.rationale)
      .slice()
      .sort((a, b) => Math.abs(b.daysAfterPrimaryCompletion ?? -Infinity) - Math.abs(a.daysAfterPrimaryCompletion ?? -Infinity))
      .slice(0, 5);
  }

  // Adjudication if present (ui-brief.md): judge's concern level + the one-line
  // rationale excerpt ctcm/api.py already trimmed to one sentence server-side.
  // Renders the API's text verbatim (escaped) -- the global banned-word tone
  // rule (global-constraints.md) is enforced upstream in ctcm/adjudicate.py's
  // _defuse(), not re-implemented here.
  function adjudicationLineHtml(adjudication) {
    if (!adjudication || !adjudication.rationale) return "";
    const concern = String(adjudication.concern || "").toLowerCase();
    return (
      '<p class="case-card-adjudication"><b>Adjudication:</b> ' + escapeHtml(concern) +
      " concern — " + escapeHtml(adjudication.rationale) + "</p>"
    );
  }

  function caseStudiesHtml(rows) {
    const picks = pickCaseStudies(rows);
    if (!picks.length) return "";
    const cards = picks.map((r) =>
      '<a class="case-card" href="#/trial/' + encodeURIComponent(r.nctId) + '">' +
        '<span class="case-card-id mono">' + r.nctId + "</span>" +
        '<p class="case-card-story">' + escapeHtml(r.rationale) + "</p>" +
        adjudicationLineHtml(r.adjudication) +
      "</a>"
    ).join("");
    return (
      '<section class="case-studies" aria-label="Case studies">' +
        '<p class="case-studies-heading">Case studies</p>' +
        '<div class="case-list">' + cards + "</div>" +
      "</section>"
    );
  }

  let indexSort = { key: "daysAfterEnrolment", dir: -1 };
  let indexFilters = { severity: new Set(), changeType: new Set(), sponsorClass: new Set(), phase: new Set() };
  let indexQuery = "";
  let indexRequestSeq = 0; // guards against a slow, now-superseded fetch overwriting a newer one

  function currentIndexParams() {
    return {
      severity: [...indexFilters.severity],
      change_type: [...indexFilters.changeType],
      sponsor_class: [...indexFilters.sponsorClass],
      phase: [...indexFilters.phase],
      q: indexQuery,
      sort: (indexSort.dir === -1 ? "-" : "") + indexSort.key
    };
  }

  async function refreshLedger() {
    const seq = ++indexRequestSeq;
    const data = await fetchIndex(currentIndexParams());
    if (seq !== indexRequestSeq) return; // a newer request already landed
    renderLedgerRows(data.rows);
  }

  async function renderIndexView() {
    const app = document.getElementById("app");
    app.innerHTML = topbarHtml() + '<main class="index-view"><p class="status-note">Loading trial index…</p></main>';

    indexSort = { key: "daysAfterEnrolment", dir: -1 };
    indexFilters = { severity: new Set(), changeType: new Set(), sponsorClass: new Set(), phase: new Set() };
    indexQuery = "";

    const data = await fetchIndex({});
    const allRows = data.rows;
    const counts = data.counts;

    const filterDefs = [
      ["severity", "Severity"], ["changeType", "Change"], ["sponsorClass", "Sponsor class"], ["phase", "Phase"]
    ];
    const chipsHtml = filterDefs.map(([key, label]) => {
      const values = [...new Set(allRows.map((r) => r[key]).filter((v) => v !== null && v !== undefined))].sort();
      const chips = values.map((v) => {
        const text = key === "phase" ? phaseLabel(v) : v;
        return '<button class="chip" data-filter-key="' + key + '" data-filter-value="' + escapeHtml(v) +
               '" aria-pressed="false">' + escapeHtml(text) + "</button>";
      }).join("");
      return '<div class="filter-group"><span class="filter-label">' + label + "</span>" + chips + "</div>";
    }).join("");

    const changedCount = counts.signalTrials;

    app.innerHTML =
      topbarHtml() +
      '<main class="index-view">' +
        '<section class="masthead">' +
          '<p class="eyebrow">Registry change monitor — index</p>' +
          "<h1><span class=\"counter\">" + changedCount + "</span> trial" + (changedCount === 1 ? "" : "s") +
            " changed " + (changedCount === 1 ? "its" : "their") + " primary outcome after enrolment began</h1>" +
          '<p class="tagline">Every version below was public the entire time. ' + escapeHtml(counts.caveat) + "</p>" +
        "</section>" +
        caseStudiesHtml(allRows) +
        '<section class="filters" role="group" aria-label="Filter trials">' + chipsHtml +
          '<div class="search-group">' +
            '<span class="filter-label">Search</span>' +
            '<input type="search" class="search-input" id="index-search" placeholder="NCT ID, sponsor, condition…">' +
          "</div>" +
        "</section>" +
        '<div class="table-wrap"><table class="ledger" id="ledger">' +
          "<thead><tr>" +
            '<th data-sort="nctId">Trial<span class="sort-arrow"></span></th>' +
            '<th data-sort="changeType">Change<span class="sort-arrow"></span></th>' +
            '<th data-sort="severity">Severity<span class="sort-arrow"></span></th>' +
            '<th data-sort="sponsorClass">Sponsor class<span class="sort-arrow"></span></th>' +
            '<th data-sort="phase">Phase<span class="sort-arrow"></span></th>' +
            '<th data-sort="daysAfterEnrolment">Days after enrolment<span class="sort-arrow"></span></th>' +
          "</tr></thead><tbody></tbody>" +
        "</table></div>" +
      "</main>";

    wireIndexInteractions();
    renderLedgerRows(allRows); // no filters active yet: identical to the filtered result
  }

  function renderLedgerRows(rows) {
    const tbody = document.querySelector("#ledger tbody");
    tbody.innerHTML = rows.length ? rows.map((s) =>
      '<tr data-nct="' + s.nctId + '" tabindex="0">' +
        '<td><span class="nct-link mono">' + s.nctId + "</span><br>" +
          escapeHtml((s.conditions && s.conditions.length ? s.conditions.join(", ") : s.sponsor) || "") + "</td>" +
        "<td>" + (s.changeType ? escapeHtml(s.changeType) : "—") + "</td>" +
        "<td>" + (s.severity ? '<span class="tag severity-' + s.severity.toLowerCase() + '">' + s.severity + "</span>" : "—") + "</td>" +
        "<td>" + (s.sponsorClass || "—") + "</td>" +
        "<td>" + phaseLabel(s.phase) + "</td>" +
        '<td class="mono">' + (s.daysAfterEnrolment != null ? fmtDaysAfterEnrolment(s.daysAfterEnrolment) : "—") + "</td>" +
      "</tr>"
    ).join("") : '<tr class="empty-row"><td colspan="6">No trials match the selected filters.</td></tr>';

    tbody.querySelectorAll("tr[data-nct]").forEach((tr) => {
      const go = () => { location.hash = "#/trial/" + tr.dataset.nct; };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
  }

  function wireIndexInteractions() {
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const { filterKey, filterValue } = chip.dataset;
        const set = indexFilters[filterKey];
        set.has(filterValue) ? set.delete(filterValue) : set.add(filterValue);
        chip.setAttribute("aria-pressed", set.has(filterValue));
        refreshLedger();
      });
    });
    document.querySelectorAll("#ledger th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        indexSort.dir = indexSort.key === key ? -indexSort.dir : 1;
        indexSort.key = key;
        document.querySelectorAll("#ledger th .sort-arrow").forEach((a) => (a.textContent = ""));
        th.querySelector(".sort-arrow").textContent = indexSort.dir === 1 ? "↑" : "↓";
        refreshLedger();
      });
    });
    let searchDebounce = null;
    document.getElementById("index-search").addEventListener("input", (e) => {
      indexQuery = e.target.value.trim();
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(refreshLedger, 150);
    });
  }

/* =========================================================================
   6. TRIAL VIEW — the scrubber
   ========================================================================= */
  let activeScrubber = null; // {next(), prev()} for the currently mounted trial view, or null

  function nodePercent(i, n) {
    if (n <= 1) return 50;
    const pad = 7;
    return pad + (i / (n - 1)) * (100 - 2 * pad);
  }

  // Places a reference date honestly relative to the (evenly spaced) version
  // nodes by interpolating between whichever two fetched versions bracket it.
  function refLinePercent(dateISO, versions) {
    const t = new Date(dateISO).getTime();
    const n = versions.length;
    if (t <= new Date(versions[0].date).getTime()) return nodePercent(0, n);
    if (t >= new Date(versions[n - 1].date).getTime()) return nodePercent(n - 1, n);
    for (let i = 0; i < n - 1; i++) {
      const t0 = new Date(versions[i].date).getTime();
      const t1 = new Date(versions[i + 1].date).getTime();
      if (t >= t0 && t <= t1) {
        const frac = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
        return nodePercent(i, n) + frac * (nodePercent(i + 1, n) - nodePercent(i, n));
      }
    }
    return 50;
  }

  // Verified against the live Record History "Compare" flow (2026-08-08, see
  // ctcm/api.py:_compare_url — same formula, kept in sync by hand since there's
  // no shared module between Python and this file): a/b are 1-indexed display
  // versions, int-API version 0 == displayed "Version 1".
  function compareUrl(trial, vFrom, vTo) {
    return trial.historyUrl + "&a=" + (vFrom + 1) + "&b=" + (vTo + 1) + "#version-content-panel";
  }

  async function renderTrialView(nctId) {
    const app = document.getElementById("app");
    const trial = await getTrial(nctId);
    if (!trial) {
      app.innerHTML = topbarHtml() +
        '<main><a class="back-link" href="#/">&larr; All trials</a>' +
        '<p class="status-note">No trial found for ' + escapeHtml(nctId) + ".</p></main>";
      return;
    }

    const n = trial.versions.length;
    const signalVersions = new Set((trial.findings || []).filter((f) => f.severity === "SIGNAL").map((f) => f.toVersion));
    const nodesHtml = trial.versions.map((v, i) =>
      '<div class="v-marker" style="left:' + nodePercent(i, n) + '%">' +
        '<button class="v-node' + (signalVersions.has(v.version) ? " has-signal" : "") + '" data-index="' + i +
          '" aria-pressed="false" aria-label="Version ' + v.version + ", " + v.date +
          (signalVersions.has(v.version) ? " (flagged change)" : "") + '"></button>' +
        '<span class="v-label mono">v' + v.version + "</span>" +
      "</div>"
    ).join("");

    const enrolPct = trial.enrolmentStart ? refLinePercent(trial.enrolmentStart, trial.versions) : null;
    const compPct = trial.primaryCompletion ? refLinePercent(trial.primaryCompletion, trial.versions) : null;

    app.innerHTML =
      topbarHtml() +
      '<main class="trial-view">' +
        '<a class="back-link" href="#/">&larr; All trials</a>' +
        '<div class="trial-header">' +
          '<div class="trial-id-row">' +
            '<span class="nct-id mono">' + trial.nctId + "</span>" +
            '<span class="status-pill" id="status-pill"></span>' +
          "</div>" +
          '<h1 class="trial-title">' + escapeHtml(trial.briefTitle || trial.nctId) + "</h1>" +
          (trial.officialTitle ? '<p class="trial-official">' + escapeHtml(trial.officialTitle) + "</p>" : "") +
          '<div class="trial-meta">' +
            "<span><strong>" + escapeHtml(trial.sponsor || "Sponsor unknown") + "</strong></span>" +
            "<span>" + phaseLabel(trial.phase) + "</span>" +
            "<span>Enrolment began <strong class=\"mono\">" + (trial.enrolmentStart || "unknown") + "</strong>" +
              (trial.enrolmentStartType ? " (" + trial.enrolmentStartType.toLowerCase() + ")" : "") + "</span>" +
            "<span>Primary completion <strong class=\"mono\">" + (trial.primaryCompletion || "unknown") + "</strong>" +
              (trial.primaryCompletionType ? " (" + trial.primaryCompletionType.toLowerCase() + ")" : "") + "</span>" +
          "</div>" +
        "</div>" +

        '<section class="scrubber" aria-label="Version scrubber">' +
          '<div class="scrubber-scroll"><div class="scrubber-track">' +
            '<div class="timeline-baseline"></div>' +
            (enrolPct != null ? '<div class="ref-line" style="left:' + enrolPct + '%"><span class="ref-label">Enrolment began</span></div>' : "") +
            (compPct != null ? '<div class="ref-line" style="left:' + compPct + '%"><span class="ref-label">Primary completion</span></div>' : "") +
            nodesHtml +
            '<div class="playhead" id="playhead" style="left:' + nodePercent(0, n) + '%"></div>' +
          "</div></div>" +
        "</section>" +

        '<div class="readout">' +
          '<span class="readout-version mono" id="readout-version"></span>' +
          '<span class="readout-date mono" id="readout-date"></span>' +
          '<span class="readout-days mono" id="readout-days"></span>' +
          '<span class="readout-status" id="readout-status"></span>' +
        "</div>" +

        '<div class="outcome-panel">' +
          '<div class="card primary-card">' +
            '<p class="card-label">Primary outcome</p>' +
            '<p class="primary-measure" id="primary-measure"></p>' +
            '<p class="primary-timeframe mono" id="primary-timeframe"></p>' +
            '<p class="primary-description" id="primary-description"></p>' +
            '<div class="primary-extra" id="primary-extra" hidden></div>' +
            '<p class="deep-links" id="deep-links"></p>' +
          "</div>" +
          '<div class="card">' +
            '<p class="card-label">Secondary outcomes (<span id="secondary-count"></span>)</p>' +
            '<ul class="secondary-list" id="secondary-list"></ul>' +
            '<div class="secondary-removed" id="secondary-removed" hidden>' +
              '<p class="card-label">No longer measured</p>' +
              "<ul></ul>" +
            "</div>" +
          "</div>" +
        "</div>" +
      "</main>";

    initScrubber(trial);
  }

  function initScrubber(trial) {
    const n = trial.versions.length;
    const track = document.querySelector(".scrubber-track");
    const playhead = document.getElementById("playhead");
    const nodeButtons = [...track.querySelectorAll(".v-node")];
    let idx = 0;

    function select(i, opts) {
      idx = Math.max(0, Math.min(n - 1, i));
      nodeButtons.forEach((b, j) => b.setAttribute("aria-pressed", j === idx));
      playhead.style.left = nodePercent(idx, n) + "%";
      renderOutcomePanel(trial, idx);
      if (opts && opts.focus) nodeButtons[idx].focus();
    }

    nodeButtons.forEach((b, i) => b.addEventListener("click", () => select(i)));

    function xToIndex(clientX) {
      const rect = track.getBoundingClientRect();
      const pct = ((clientX - rect.left) / rect.width) * 100;
      let best = 0, bestDist = Infinity;
      trial.versions.forEach((_, i) => {
        const d = Math.abs(nodePercent(i, n) - pct);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }

    let dragging = false;
    track.addEventListener("pointerdown", (e) => {
      dragging = true;
      track.setPointerCapture(e.pointerId);
      select(xToIndex(e.clientX));
    });
    track.addEventListener("pointermove", (e) => { if (dragging) select(xToIndex(e.clientX)); });
    track.addEventListener("pointerup", () => { dragging = false; });
    track.addEventListener("pointercancel", () => { dragging = false; });

    activeScrubber = {
      next: () => select(idx + 1, { focus: true }),
      prev: () => select(idx - 1, { focus: true })
    };

    select(0);
  }

  // Single persistent listener (not re-added per render) driven by activeScrubber,
  // which is null whenever no trial view is mounted.
  window.addEventListener("keydown", (e) => {
    if (!activeScrubber) return;
    if (e.key === "ArrowRight") { activeScrubber.next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { activeScrubber.prev(); e.preventDefault(); }
  });

  function timingClass(daysAfterEnrolment, daysAfterCompletion) {
    if (daysAfterCompletion > 0) return "after-completion";
    if (daysAfterEnrolment >= 0) return "after-enrolment";
    return "";
  }

  function diffSecondaryList(prevList, curList) {
    const prevMeasures = new Set((prevList || []).map((o) => o.measure));
    const removed = (prevList || []).filter((o) => !curList.some((c) => c.measure === o.measure));
    return { removed, isNew: (o) => prevList !== null && !prevMeasures.has(o.measure) };
  }

  function renderOutcomePanel(trial, idx) {
    const cur = trial.versions[idx];
    const prev = idx > 0 ? trial.versions[idx - 1] : null;
    const daysAfterEnrolment = trial.enrolmentStart ? daysBetween(cur.date, trial.enrolmentStart) : null;
    const daysAfterCompletion = trial.primaryCompletion ? daysBetween(cur.date, trial.primaryCompletion) : null;

    document.getElementById("readout-version").textContent = "v" + cur.version;
    document.getElementById("readout-date").textContent = cur.date;
    const daysEl = document.getElementById("readout-days");
    daysEl.textContent = daysAfterEnrolment != null ? fmtDaysAfterEnrolment(daysAfterEnrolment) : "enrolment date unknown";
    daysEl.className = "readout-days mono " + (daysAfterEnrolment != null ? timingClass(daysAfterEnrolment, daysAfterCompletion) : "");
    const statusText = cur.overallStatus ? cur.overallStatus.replace(/_/g, " ") : "—";
    document.getElementById("readout-status").textContent = statusText;
    document.getElementById("status-pill").textContent = statusText;

    const curP = cur.primaryOutcomes[0] || { measure: "—", description: "", timeFrame: "—" };
    const prevP = prev ? (prev.primaryOutcomes[0] || { measure: "", description: "", timeFrame: "" }) : null;
    document.getElementById("primary-measure").innerHTML = renderDiff(prevP && prevP.measure, curP.measure);
    document.getElementById("primary-timeframe").innerHTML = renderDiff(prevP && prevP.timeFrame, curP.timeFrame);
    document.getElementById("primary-description").innerHTML = renderDiff(prevP && prevP.description, curP.description);

    const extraEl = document.getElementById("primary-extra");
    const extras = cur.primaryOutcomes.slice(1);
    if (extras.length) {
      extraEl.hidden = false;
      extraEl.innerHTML = '<p class="card-label">Additional primary outcomes</p>' +
        extras.map((o) => '<p class="primary-extra-item">' + escapeHtml(o.measure) +
          '<span class="badge">' + escapeHtml(o.timeFrame) + "</span></p>").join("");
    } else {
      extraEl.hidden = true;
    }

    const { removed, isNew } = diffSecondaryList(prev ? prev.secondaryOutcomes : null, cur.secondaryOutcomes);
    document.getElementById("secondary-count").textContent = cur.secondaryOutcomes.length;
    document.getElementById("secondary-list").innerHTML = cur.secondaryOutcomes.map((o) =>
      '<li class="' + (isNew(o) ? "is-new" : "") + '"><span class="sec-measure">' + escapeHtml(o.measure) +
      '</span><span class="sec-timeframe mono">' + escapeHtml(o.timeFrame) + "</span></li>"
    ).join("");
    const removedWrap = document.getElementById("secondary-removed");
    if (removed.length) {
      removedWrap.hidden = false;
      removedWrap.querySelector("ul").innerHTML = removed.map((o) =>
        "<li><del>" + escapeHtml(o.measure) + "</del></li>").join("");
    } else {
      removedWrap.hidden = true;
    }

    const linksEl = document.getElementById("deep-links");
    linksEl.innerHTML = prev
      ? "Compare on ClinicalTrials.gov: " +
        '<a href="' + compareUrl(trial, prev.version, cur.version) + '" target="_blank" rel="noopener">v' + prev.version + " · " + prev.date + "</a> vs " +
        '<a href="' + compareUrl(trial, prev.version, cur.version) + '" target="_blank" rel="noopener">v' + cur.version + " · " + cur.date + " ↗</a>"
      : "View on ClinicalTrials.gov: " +
        '<a href="' + trial.historyUrl + "&a=" + (cur.version + 1) + '#version-content-panel" target="_blank" rel="noopener">v' +
          cur.version + " · " + cur.date + " ↗</a>";
  }
</script>
</body>
