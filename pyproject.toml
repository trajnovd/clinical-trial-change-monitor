[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcm"
version = "0.1.0"
description = "Clinical Trial Registry Change Monitor"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "fastapi",
    "uvicorn",
    "pytest",
]

[tool.setuptools]
packages = ["ctcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
